<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语程APP二维码</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6b8e7b 0%, #8ba89a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: #6b8e7b;
            border-radius: 16px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }
        #qrcode {
            display: inline-block;
            padding: 20px;
            border: 2px solid #f0f0f0;
            border-radius: 16px;
            margin-bottom: 24px;
        }
        #qrcode img {
            display: block;
        }
        .url {
            color: #6b8e7b;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 24px;
            padding: 12px;
            background: #f8f8f8;
            border-radius: 8px;
        }
        .tip {
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">语</div>
        <h1>语程APP</h1>
        <p class="subtitle">扫码体验</p>
        <div id="qrcode"></div>
        <div class="url">http://192.168.0.101:4000</div>
        <p class="tip">语音智能日程管理 · 手机和电脑连同一个WiFi</p>
    </div>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "http://192.168.0.101:4000",
            width: 256,
            height: 256,
            colorDark: "#333333",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
